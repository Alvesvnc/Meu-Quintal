# Stack de DESENVOLVIMENTO. A de producao e docker-compose.prod.yml, que tem
# `name:` proprio — sem isso os dois disputariam o mesmo container.
# NAO adicionar `name:` aqui: mudaria o prefixo do volume quintal-pg-data e
# o banco de desenvolvimento apareceria vazio.

services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-quintal-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - quintal-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  quintal-pg-data:
