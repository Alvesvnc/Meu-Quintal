packages:
  - 'apps/*'
  - 'packages/*'
  - 'server'

# pnpm bloqueia postinstall por padrao (supply-chain). Liberados sob demanda:
#   prisma / @prisma/*  -> gera o client tipado e baixa os engines
#   argon2              -> compila binding nativo do hash de senha
#   esbuild             -> baixa binario da plataforma (vite)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
